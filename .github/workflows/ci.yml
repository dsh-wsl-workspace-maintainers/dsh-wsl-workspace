name: checks
# Unified entry: every run step below is the same `npm run …` the README of
# TESTING.md and docs/CHECK-CATALOG.md advertise for local use.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
  # Nightly, off the hour nobody watches: the full plane/user grid. Every pull request gets the
  # 30-second anti-rot smoke below and nothing more, because 16 measured cells cost more than a
  # review should wait for. This is where the drivers that smoke skips — seven of the eight —
  # actually get measured, and where the two planes are compared against each other rather than
  # one of them being assumed. `17 4` rather than `0 4` so this does not land in the same minute as
  # every other scheduled job on the planet.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: gates on the committed artifact plane (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: committed lib/ is what HEAD says it is (before anything can rewrite it)
        run: node scripts/verify-lib-sync.mjs --check-only
      - name: verify-lib on the committed lib/
        run: npm run verify
      - name: pure-node unit bucket
        run: npm run test:unit
      # The claims the unit bucket cannot hold: a declared red the product has not been changed to
      # satisfy would make `test:unit` permanently red. This step runs them with the arithmetic that
      # makes a declared red safe — an undeclared failure and a declared red that turned green are
      # both red — so the two defects it carries stay visible instead of becoming a shrug.
      - name: documentation claims (panel vs build, declared reds accounted for)
        run: npm run test:docs-claims
      - name: rebuild must reproduce the committed lib/ byte-for-byte
        run: |
          npm run build
          if ! git diff --quiet -- lib; then
            echo "RED — lib/ in HEAD is not what a build of HEAD's src/ produces:"
            git diff --stat -- lib
            exit 1
          fi
      - name: artifact identity (three packs agree; TESTING.md contract)
        run: node scripts/verify-artifact-identity.mjs
      - name: documentation parity (declared README sections, shared facts, link graph)
        run: npm run test:docs

  runtime-tests:
    name: node buckets against the pinned host tree (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: install pinned @deepseek-ai host packages
        run: node ci/install-pinned.mjs
      - name: node bucket (build + host-package tests + host pair + rank --strict)
        run: npm run test:node
      - name: typecheck does not grow past its recorded baseline
        run: node scripts/typecheck-gate.mjs
      - name: clean npm install of the packed tarball
        run: npm run verify:install
      # Expected green, and it runs where a green belongs: after `verify:install`, before the
      # one red-by-design step below. #47's profile-shaped arms.
      - name: profile-shaped isolation (#47 call-time peer imports)
        run: npm run test:profile
      # LAST, on purpose. A failing step skips everything after it, and this step is red by
      # design until #44 §6 is fixed — frame 36797162445 proves the cost of getting this wrong:
      # with the seam step in the middle, `typecheck does not grow past its recorded baseline`
      # and `clean npm install of the packed tarball` both came back `skipped`. A known red is
      # allowed to be the frame's verdict, not to silence the gates behind it. It aggregates the
      # two seam suites through `scripts/run-seams.mjs` (one step naming every failing
      # assertion), so no later step depends on it.
      - name: seam ledger (#44 §6 reds must equal tests/deliberate-reds.mjs — runs last)
        run: npm run test:seams

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-tests-logs
          path: ~/.npm/_logs/
          retention-days: 7

  repro-e2e:
    name: nested-skill repro against the real share (windows + WSL1 Ubuntu)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: lint-build
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      # Required, no default (issue #44 §7): the harness used to default to `mille`, a
      # maintainer-machine account, so on a runner it addressed a tree that does not exist and
      # failed for a reason unrelated to skill discovery.
      WSL_COMPAT_USER: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: provision WSL1 Ubuntu
        uses: Vampire/setup-wsl@v3
        with:
          wsl-version: 1
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          systemd: 'false'
          use-headless: 'false'
      - name: build the repro tree inside the distribution
        run: |
          set -u
          mkdir -p logs
          # Keep the instance warm for the same reason wsl-gate does: the 9P share is invisible
          # when the distribution idles out, and an absent share reads as an empty catalogue.
          wsl.exe -d Ubuntu-24.04 -- bash -c '(nohup sleep 900 >/dev/null 2>&1 & echo kept-alive)'
          # `bash -c "…"` rather than `bash /tmp/script.sh`: the Windows bash runner rewrites a
          # bare /tmp/… argument to the Windows temp dir (TESTING.md, "Nested skill-catalog
          # regression" — both Git Bash traps recorded there).
          wsl.exe -d Ubuntu-24.04 -- bash -c 'mkdir -p /tmp && cat > /tmp/repro-setup.sh' < scripts/repro-setup.sh
          wsl.exe -d Ubuntu-24.04 -- bash -c 'bash /tmp/repro-setup.sh'
      - name: the repro tree is where the harness will look
        run: |
          set -u
          # Printed rather than assumed: the harness reads \\wsl.localhost\<distro>\home\<user>\…,
          # and a root-owned tree somewhere else is a setup failure, not a discovery failure.
          wsl.exe -d Ubuntu-24.04 -- bash -c 'ls -d ~/repro-ws-root ~/repro-ws-root/*' 2>&1 | tr -d '\0' | tee logs/repro-tree.log
      - name: drive the provider against the real 9P share
        continue-on-error: true
        run: |
          set -u
          rc=0
          npm run test:repro 2>&1 | tee logs/repro-e2e.log || rc=$?
          echo "repro-e2e rc=$rc"
          exit "$rc"
      - name: what the repro step said, whether or not it passed
        if: always()
        run: |
          tail -30 logs/repro-e2e.log 2>/dev/null || echo "(no repro log — the setup step above is where it stopped)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-e2e-logs
          path: logs/
          retention-days: 7

  wsl-gate:
    name: real-WSL hard gates (windows + WSL${{ matrix.wslVersion }} Ubuntu)
    runs-on: windows-latest
    timeout-minutes: 35
    needs: lint-build
    # Both kernel shapes, on the same distribution. The reading that decides "this command is waiting
    # for a keyboard" is a `/proc` walk, and WSL1 answers it differently from WSL2: `wchan` reads `0`
    # for every process and no fd points at a pts, so a keyboard wait there looked, for two rounds,
    # exactly like a command that was merely slow. One runner version could not see that, and the
    # product difference is real — measured on the WSL1 frame: five cells, all in that family, with the
    # call burning its 20 s and 60 s deadlines.
    strategy:
      fail-fast: false
      matrix:
        wslVersion: [1, 2]
    defaults:
      run:
        shell: bash
    env:
      WSL_COMPAT_DISTRO: Ubuntu-24.04
      WSL_COMPAT_USER: root
      # NOTE: do NOT set WSL_COMPAT_ROOT here — the drivers' built-in default
      # (/tmp/dsh-wsl-compat, a Linux-side path) is what they need, and the
      # Windows bash runner rewrites POSIX-path-shaped env values (frame 3:
      # WSL_COMPAT_ROOT=/tmp/… reached node as C:\tmp\…).
      WSL_COMPAT_RELAY_CWD: '\\wsl.localhost\Ubuntu-24.04\tmp\dsh-wsl-relay-ws'
      WSL_COMPAT_DRIVE_CWD: 'C:\'
      # search-real's Windows-/mnt assertion: point it at this checkout's own
      # tests dir (the value baked into the script names the maintainer
      # machine's deployed copy under D:\ProgramData).
      WSL_COMPAT_DRIVE_PATH: ${{ github.workspace }}\tests
      TMP: 'C:\tmp'
      TEMP: 'C:\tmp'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: install pinned @deepseek-ai host packages
        run: node ci/install-pinned.mjs
      - name: provision WSL${{ matrix.wslVersion }} Ubuntu
        uses: Vampire/setup-wsl@v3
        with:
          wsl-version: ${{ matrix.wslVersion }}
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          systemd: 'false'
          use-headless: 'false'
      - name: pin the distro to WSL${{ matrix.wslVersion }} and the default-distro registry keys
        run: |
          set -u
          want=${{ matrix.wslVersion }}
          v=$(wsl.exe -l -v 2>/dev/null | tr -d '\0' | grep -i ubuntu | grep -oE '[12]$' || true)
          if [ "$v" != "$want" ]; then
            echo "instance is VERSION=${v:-unknown}; converting to $want (conversion does not need Hyper-V)"
            wsl.exe --set-version Ubuntu-24.04 "$want" 2>&1 | tr -d '\0' | tail -2
          fi
          wsl.exe -l -v 2>/dev/null | tr -d '\0' | grep -iE "ubuntu.*[[:space:]]${want}$" || { echo "RED — Ubuntu-24.04 is not running as WSL${want}"; exit 1; }
          wsl.exe --set-default Ubuntu-24.04
      - name: fixture preparation (bounded keep-warm so the 9P share stays visible)
        run: |
          mkdir -p /c/tmp
          # The keeper has to outlast BOTH planes. The 9P share stops answering when the distribution
          # idles out, and a Windows spawn into `\\wsl.localhost\…` reports that as
          # `spawn <program> ENOENT` — which is how the WSL2 arm's second pass came to look like a
          # missing node binary. 2400 s covers this job's own 35-minute bound.
          wsl.exe -d Ubuntu-24.04 -- bash -c 'mkdir -p /tmp/dsh-wsl-relay-ws /tmp/dsh-wsl-compat /root/symprobe/ws && (nohup bash -c "for i in \$(seq 1 40); do sleep 60; done" >/dev/null 2>&1 & echo kept-alive)'
      - name: preflight diagnostics (always collected before the gates)
        run: |
          mkdir -p logs
          { wsl.exe --version 2>&1; wsl.exe -l -v 2>&1; wsl.exe -d Ubuntu-24.04 -- uname -a 2>&1;
            wsl.exe -d Ubuntu-24.04 -- bash -c 'grep --version | head -1; find --version | head -1; whoami'; } | tr -d '\0' > logs/preflight-wsl.log 2>&1 || true
          node -e 'const fs=require("node:fs");for(const p of ["\\\\wsl.localhost\\Ubuntu-24.04\\tmp","\\\\wsl.localhost\\Ubuntu-24.04\\tmp\\dsh-wsl-relay-ws"])console.log(p, fs.existsSync(p)?"present":"ABSENT")' > logs/preflight-unc.log 2>&1 || true
          cat logs/preflight-wsl.log logs/preflight-unc.log
      - name: build (smoke-built / shell-extra / client consume lib/)
        run: npm run build
      - name: win32-semantics unit files (wsl-skills + fs-policy assume drive-shaped cwd)
        run: npm run test:win32
      - name: run every WSL gate, collect all failures in one frame
        run: |
          # GitHub's bash runs with -e: every guard below must be compound,
          # or the first red kills the loop and the remaining gates go dark
          # (frame 3 did exactly that after shell-extra).
          FAIL=0
          run_one() {
            local name="$1"; shift
            local rc=0
            echo "::group::$name"
            "$@" > "logs/$name.log" 2>&1 || rc=$?
            echo "rc=$rc"
            # `tail -6` alone was not attribution: a driver that runs 45 of 72 cells leaves its
            # summary line, its failing cells above the window, and the frame read as one red with
            # no name attached. Print the verdict line, every FAIL, and the short-run guard's own
            # sentence — then the tail for context.
            grep -aE "checks passed|bash-session-real: RED|  FAIL" "logs/$name.log" 2>/dev/null | head -25 || true
            tail -6 "logs/$name.log" || true
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then FAIL=1; fi
            return 0
          }
          run_one smoke node --experimental-strip-types tests/smoke.ts
          run_one exec-shape node --experimental-strip-types tests/exec-shape.mjs
          run_one shell-extra node tests/shell-extra.mjs
          run_one make-smoke-built node scripts/make-smoke-built.mjs
          run_one smoke-built node --experimental-strip-types tests/smoke-built.ts
          # Every plane consumer names its plane. `plane.mjs` has no default (issue #44 §1): the
          # src lines are spelled out rather than left to an unset variable, so a green line is a
          # claim about src/ and not about whichever plane the driver happened to assume.
          run_one fs-real env DSH_WSL_TEST_PLANE=src node --experimental-strip-types scripts/compatibility/fs-real.mjs
          run_one skills-real env DSH_WSL_TEST_PLANE=src node --experimental-strip-types scripts/compatibility/skills-real.mjs
          run_one search-real env DSH_WSL_TEST_PLANE=src node --experimental-strip-types scripts/compatibility/search-real.mjs
          run_one relay-real env DSH_WSL_TEST_PLANE=src node --experimental-strip-types scripts/compatibility/relay-real.mjs
          # The readiness contract against a login pass that rewrites it. Own fixture root, and
          # MSYS_NO_PATHCONV=1 on the assignment, for the same reason as bash-parity-real below.
          MSYS_NO_PATHCONV=1 DSH_WSL_TEST_PLANE=src WSL_COMPAT_ROOT=/tmp/dsh-wsl-relay-profile node --experimental-strip-types scripts/compatibility/relay-profile-real.mjs > logs/relay-profile-real.log 2>&1 || { echo "rc=$?"; tail -8 logs/relay-profile-real.log || true; FAIL=1; }
          run_one tool-bash-real env DSH_WSL_TEST_PLANE=src node --experimental-strip-types scripts/compatibility/tool-bash-real.mjs
          # The two releases this plugin makes about a distribution that is not the one the gates run
          # on, held to a GNU control and to a busybox shape obtained from the distribution's own
          # `/usr/bin/busybox` — no container, because the product's only execution path is `wsl.exe`.
          run_one distro-shape-real env DSH_WSL_TEST_PLANE=src node --experimental-strip-types scripts/compatibility/distro-shape-real.mjs
          run_one bash-session-real env DSH_WSL_TEST_PLANE=src node --experimental-strip-types scripts/compatibility/bash-session-real.mjs
          MSYS_NO_PATHCONV=1 DSH_WSL_TEST_PLANE=src WSL_COMPAT_ROOT=/tmp/dsh-wsl-parity node --experimental-strip-types scripts/compatibility/bash-parity-real.mjs > logs/bash-parity-real.log 2>&1 || { echo "rc=$?"; tail -8 logs/bash-parity-real.log || true; FAIL=1; }
          # The same gates against the shipped bundle, which is the half that was previously only
          # ever an additional pass over an assumed `src` default. Each pass gets its own fixture
          # root because these drivers create rather than clean their tree — two passes over one
          # /tmp/dsh-wsl-compat is a race, not a rerun.
          # `|| { tail; FAIL=1; }` rather than `|| echo rc=$?`: a lib-plane failure that
          # leaves no reason in the step log is a red nobody can attribute.
          run_lib() {
            local name="$1"; shift
            local rc=0
            echo "::group::lib-$name"
            DSH_WSL_TEST_PLANE=lib "$@" > "logs/lib-$name.log" 2>&1 || rc=$?
            echo "rc=$rc"
            grep -aE "  FAIL|: RED|checks passed" "logs/lib-$name.log" 2>/dev/null | head -20 || true
            tail -8 "logs/lib-$name.log" || true
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then FAIL=1; fi
            return 0
          }
          # fs-real takes its root from the distro's own $HOME and relay-real from a
          # Windows-shaped variable, so neither needs a second root: only search-real reads
          # WSL_COMPAT_ROOT, and it must be handed over with MSYS_NO_PATHCONV=1. Without that
          # the Windows bash runner rewrites `/tmp/dsh-wsl-lib` into `C:\tmp\dsh-wsl-lib` and
          # the driver assembles `\\wsl.localhost\Ubuntu-24.04C:\tmp\…` — frame
          # 36736537229 proved it (errno -4094, syscall mkdir). Same trap ci.yml already
          # documents for WSL_COMPAT_ROOT at the top of this job.
          run_lib fs-real node --experimental-strip-types scripts/compatibility/fs-real.mjs
          MSYS_NO_PATHCONV=1 DSH_WSL_TEST_PLANE=lib WSL_COMPAT_ROOT=/tmp/dsh-wsl-lib node --experimental-strip-types scripts/compatibility/search-real.mjs > logs/lib-search-real.log 2>&1 || { echo "rc=$?"; tail -8 logs/lib-search-real.log || true; FAIL=1; }
          run_lib relay-real node --experimental-strip-types scripts/compatibility/relay-real.mjs
          MSYS_NO_PATHCONV=1 DSH_WSL_TEST_PLANE=lib WSL_COMPAT_ROOT=/tmp/dsh-wsl-relay-profile-lib node --experimental-strip-types scripts/compatibility/relay-profile-real.mjs > logs/lib-relay-profile-real.log 2>&1 || { echo "rc=$?"; tail -8 logs/lib-relay-profile-real.log || true; FAIL=1; }
          run_lib tool-bash-real node --experimental-strip-types scripts/compatibility/tool-bash-real.mjs
          # The two distribution promises again, against the shipped bundle this time. No
          # WSL_COMPAT_ROOT and no MSYS_NO_PATHCONV: the driver builds its own fixture path inside
          # node and hands it to `wsl.exe` as an argument, so there is nothing for the Windows bash
          # runner to rewrite. The script bytes it reads come from `lib/wsl-search.js` on this plane,
          # which is the point of running it twice.
          run_lib distro-shape-real node --experimental-strip-types scripts/compatibility/distro-shape-real.mjs
          run_lib bash-session-real node --experimental-strip-types scripts/compatibility/bash-session-real.mjs
          MSYS_NO_PATHCONV=1 DSH_WSL_TEST_PLANE=lib WSL_COMPAT_ROOT=/tmp/dsh-wsl-parity-lib node --experimental-strip-types scripts/compatibility/bash-parity-real.mjs > logs/lib-bash-parity-real.log 2>&1 || { echo "rc=$?"; tail -8 logs/lib-bash-parity-real.log || true; FAIL=1; }
          # skills-real is deliberately not attempted under `lib`: tsdown declares no entry for
          # the provider (the class is file-local to lib/index.js:1122) and plane.mjs throws
          # rather than falling back to src. Adding the entry changes what users install, so it
          # is a maintainer decision, not a night-run side effect. Those two cells (one per user
          # in the plane/user matrix) are reported *not run*, never as passes.
          exit $FAIL
      - name: the 2x2 plane/user matrix runs from a script, not a scratch directory (anti-rot)
        if: github.event_name != 'schedule'
        run: |
          # `scripts/compatibility/plane-matrix.mjs` exists so the matrix cannot rot the way
          # `scripts/repro-e2e.mjs` did — by having nothing reference it. This step is the reference:
          # root-only and one driver, about 30 s, and it exercises the orchestrator end to end
          # (per-cell fixture roots, the floor check, the three-question report) without a second
          # job or a second distribution. It runs LAST among the gates so an earlier red cannot
          # skip it, which is the same reasoning as the seam ledger in runtime-tests.
          # The report's final line declares that the ruler column did not run, so a green here
          # says out loud that it covered one column of a 2x2 and not the whole grid.
          RC=0
          node scripts/compatibility/plane-matrix.mjs --ci-as-root-only --drivers fs-real || RC=$?
          echo "plane-matrix (root column only) rc=$RC"
          exit $RC
      # The same matrix, every driver, on the nightly run. A matrix nothing measures is a matrix
      # that decays: a driver can break, a floor can be met by a shorter run, and the pull-request
      # smoke would keep saying green because it only ever looks at `fs-real`. Sixteen cells here
      # (2 planes × 1 user × 8 drivers) — the GitHub runner has one WSL user, so the ruler column is
      # still dropped and the report still says so in its last line, which is the declaration the
      # `--ci-as-root-only` path makes rather than hides.
      - name: the full grid, every driver (nightly only)
        if: github.event_name == 'schedule'
        run: |
          RC=0
          node scripts/compatibility/plane-matrix.mjs --ci-as-root-only || RC=$?
          echo "plane-matrix (all drivers, root column) rc=$RC"
          exit $RC
      - name: every gate must say which plane it loaded
        if: always()
        run: |
          RC=0
          # The module key is what plane.mjs prints (`fs`, `search`, …), not the driver's file
          # name — passing `search-real` here demanded a line no driver can emit.
          node scripts/verify-plane-log.mjs logs/fs-real.log src fs || RC=1
          node scripts/verify-plane-log.mjs logs/search-real.log src search || RC=1
          node scripts/verify-plane-log.mjs logs/skills-real.log src skills || RC=1
          node scripts/verify-plane-log.mjs logs/relay-real.log src relay || RC=1
          node scripts/verify-plane-log.mjs logs/relay-profile-real.log src relay || RC=1
          node scripts/verify-plane-log.mjs logs/tool-bash-real.log src shell || RC=1
          node scripts/verify-plane-log.mjs logs/bash-session-real.log src wsl-bash-tool || RC=1
          node scripts/verify-plane-log.mjs logs/bash-parity-real.log src wsl-bash-tool || RC=1
          node scripts/verify-plane-log.mjs logs/lib-fs-real.log lib fs || RC=1
          node scripts/verify-plane-log.mjs logs/lib-search-real.log lib search || RC=1
          node scripts/verify-plane-log.mjs logs/lib-relay-real.log lib relay || RC=1
          node scripts/verify-plane-log.mjs logs/lib-relay-profile-real.log lib relay || RC=1
          node scripts/verify-plane-log.mjs logs/lib-tool-bash-real.log lib shell || RC=1
          node scripts/verify-plane-log.mjs logs/lib-bash-session-real.log lib wsl-bash-tool || RC=1
          node scripts/verify-plane-log.mjs logs/lib-bash-parity-real.log lib wsl-bash-tool || RC=1
          echo "plane evidence collected"
          exit $RC
      - name: postflight (share state at the moment of failure)
        if: failure()
        run: |
          mkdir -p logs
          { wsl.exe -l -v 2>&1; wsl.exe -d Ubuntu-24.04 -- bash -c 'ls -la /tmp/dsh-wsl-compat 2>&1; ls -la /tmp/dsh-wsl-relay-ws 2>&1'; } | tr -d '\0' > logs/postflight.log 2>&1 || true
          cat logs/postflight.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl-gate-logs-wsl${{ matrix.wslVersion }}
          path: logs/
          retention-days: 7
