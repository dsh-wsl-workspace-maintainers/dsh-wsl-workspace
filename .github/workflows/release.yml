name: release
# Publishes the package to npm through **Trusted Publishing** (OIDC): no token, no OTP, no secret on any
# machine. The one-time half lives on npmjs.com — Package → Settings → Trusted publishing → GitHub Actions,
# with this repository and the workflow file name below; after that a tag is the whole release gesture.
#
# Triggers:
#   · push of a `v*` tag   — the normal path: the tag names the commit that was gated on main;
#   · workflow_dispatch    — republish/retry for an existing tag (e.g. the tag that predates this file).
# The tag is the version: the job refuses to publish when `package.json` disagrees with it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.7.8); empty = the ref that triggered the run'
        required: false

permissions:
  # `contents: write` is for the Release object only — the package itself goes out through OIDC, and the
  # workflow never touches a package token.
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the tag this run publishes
        id: ref
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::expected a v* tag, got '$TAG'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: the tag agrees with the package version
        run: |
          WANT="${{ steps.ref.outputs.tag }}"
          WANT="${WANT#v}"
          HAVE="$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::tag says $WANT, package.json says $HAVE"; exit 1
          fi
      - name: committed lib/ is what HEAD says it is
        run: node scripts/verify-lib-sync.mjs --check-only
      - name: rebuild must reproduce the committed lib/ byte-for-byte
        run: |
          npm run build
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ in the tag is not what a build of its src/ produces"
            git diff --stat -- lib
            exit 1
          fi
      - name: a plain npm install of this tree works
        run: node scripts/verify-install.mjs
      - name: the host contract the artifact stands on is the recorded one
        # A release is the moment a drifted host name reaches users. `dshReleases` in the manifest is a
        # table someone types and nothing verifies; this reads the pinned host tree and refuses an
        # unrecorded collision or a moved name, and points at the replay unit that measures the class.
        run: |
          node ci/install-pinned.mjs
          npm run test:contract
          npm run test:readings
      - name: publish through Trusted Publishing
        # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC identity for a short-lived publish grant,
        # and `--provenance` records which commit and workflow produced these bytes.
        #
        # Idempotent on purpose: a `workflow_dispatch` for a tag whose version is already on the registry
        # (the retry path this file documents) must be able to repair the *other* record without failing
        # here. A first publish still fails loudly if the registry rejects it.
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-wsl-workspace@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::dsh-wsl-workspace@${VERSION} is already on the registry — this run will only write the GitHub Release"
          else
            npm publish --registry=https://registry.npmjs.org --access public --provenance
          fi

      - name: publish the GitHub Release
        # A release is two records: the registry's and the repository's. Measured 2026-10-21 — `npm view`
        # said 0.7.9, the tag existed, and the Releases page stopped at 0.7.8, because nothing ever created
        # one. The notes come from the **Chinese** CHANGELOG section (this project's release notes are
        # read in Chinese) and are unwrapped first: GitHub renders release bodies with hard line breaks,
        # so prose wrapped at 100 columns arrives as a ragged column of fragments.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          # This job checks out the *tag*, which for a repair dispatch may predate the unwrapping tool (that is
          # exactly how the first attempt failed: MODULE_NOT_FOUND for scripts/unwrap-prose.mjs on v0.7.9).
          # The notes are a transformation of the tag's own CHANGELOG, so the transformer can come from the
          # default branch while the text stays the tagged one.
          if [ -f scripts/unwrap-prose.mjs ]; then
            UNWRAP="node scripts/unwrap-prose.mjs"
          else
            git fetch --depth=1 origin "refs/heads/${GITHUB_DEFAULT_BRANCH:-main}:refs/remotes/origin/${GITHUB_DEFAULT_BRANCH:-main}"
            git show "origin/${GITHUB_DEFAULT_BRANCH:-main}:scripts/unwrap-prose.mjs" > /tmp/unwrap-prose.mjs
            UNWRAP="node /tmp/unwrap-prose.mjs"
          fi
          $UNWRAP --stdout CHANGELOG.zh.md --section "$VERSION" > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::warning::no Chinese section for ${VERSION}; falling back to CHANGELOG.md"
            $UNWRAP --stdout CHANGELOG.md --section "$VERSION" > /tmp/release-notes.md
          fi
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md --verify-tag \
              || gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag \
              || gh release edit "$TAG" --generate-notes
          fi
